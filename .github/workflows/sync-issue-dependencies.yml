name: Synkronoi GitHub-issueiden riippuvuudet

on:
  issues:
    types: [edited]

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: issue-dependencies-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  synchronize:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.sender.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Hae repositorio
        uses: actions/checkout@v4
      - name: Aseta Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Käsittele yksiselitteinen riippuvuuspyyntö
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: node .github/scripts/sync_issue_dependencies.mjs
