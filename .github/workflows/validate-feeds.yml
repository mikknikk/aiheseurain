name: RSS- ja dokumentaatiotestit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Tarkista RSS, HTML, dokumentaatio ja seurantatila
    runs-on: ubuntu-latest
    steps:
      - name: Hae lähdekoodi
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aseta Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Asenna Linux-sandboxin ajonaika
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap python3
      - name: Asenna validointiriippuvuudet
        run: python -m pip install -r requirements.txt
      - name: Tarkista RSS, HTML, dokumentaatio ja seurantatila
        run: python scripts/validate_feeds.py
      - name: Tarkista seurantamoduulien tietosopimus ja esimerkit
        run: python scripts/validate_module_contract.py
      - name: Tarkista seurantamoduulirekisteri ja määritysten lataus
        run: python -m scripts.validate_module_registry
      - name: Tarkista nykyisten moduulien migraatio ja lähdeviitteet
        run: python -m scripts.validate_module_migration
      - name: Tarkista seurantakohteiden, julkaisukohteiden ja reititysten viitteet
        run: python scripts/validate_target_publication.py
      - name: Tarkista moduulikohtaiset checkpointit ja historiaviitteet
        run: python -m scripts.validate_module_state
      - name: Tarkista tekoäly- ja tutkimuspalvelujen reititys
        run: python -m scripts.validate_provider_routing
      - name: Tarkista moduuliorchestratorin sopimukset ja käyttöönoton portit
        run: python -m scripts.validate_module_orchestrator
      - name: Tarkista elokuvahavaintojen rekisteri ja jatkotoimet
        run: python -m scripts.validate_movie_observations
      - name: Tarkista elokuvien hakukriteerit ja toimintoviitteet
        run: python -m scripts.validate_movie_criteria
      - name: Tarkista RSS-raporttien julkaisulaadun portti
        if: github.event_name == 'pull_request'
        run: python scripts/validate_publication_gate.py
      - name: Tallenna julkaisulaadun porttiraportit tarkasteltaviksi
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: julkaisulaadun-porttiraportit
          path: reports/julkaisuportit/*.json
          if-no-files-found: warn
      - name: Testaa linkkitarkistimen logiikka
        run: python -m unittest discover -s tests -v
