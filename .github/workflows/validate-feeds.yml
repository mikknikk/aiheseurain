name: RSS- ja dokumentaatiotestit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Tarkista RSS, HTML, dokumentaatio ja seurantatila
    runs-on: ubuntu-latest
    steps:
      - name: Hae lähdekoodi
        uses: actions/checkout@v4
      - name: Aseta Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Aseta Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Asenna validointiriippuvuudet
        run: python -m pip install -r requirements.txt
      - name: Tarkista RSS, HTML, dokumentaatio ja seurantatila
        run: python scripts/validate_feeds.py
      - name: Tarkista selaimen JavaScriptin syntaksi
        run: |
          node --check assets/js/valvomo.js
          node --check assets/js/reader.js
          node --check assets/js/kanban.js
      - name: Testaa Valvomon, RSS-lukijan ja Kehitysjonon logiikka
        run: node --test tests/valvomo.test.mjs tests/reader.test.mjs tests/kanban.test.mjs
      - name: Testaa linkkitarkistimen logiikka
        run: python -m unittest discover -s tests -v
