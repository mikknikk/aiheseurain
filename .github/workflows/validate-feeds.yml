name: RSS- ja dokumentaatiotestit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Tarkista RSS, HTML, dokumentaatio ja seurantatila
    runs-on: ubuntu-latest
    steps:
      - name: Hae lähdekoodi
        uses: actions/checkout@v4
      - name: Aseta Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Asenna validointiriippuvuudet
        run: python -m pip install -r requirements.txt
      - name: Tarkista RSS, HTML, dokumentaatio ja seurantatila
        run: python scripts/validate_feeds.py
      - name: Testaa linkkitarkistimen logiikka
        run: python -m unittest discover -s tests -v
